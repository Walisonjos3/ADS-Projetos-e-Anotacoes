<!-- A primeira aula sobre htlmn foi para entender como criar um site para portfólio-->

<!DOCTYPE html>

<html lang="pt-BR">  <!-- Isso serve para definir o idioma que será utilizado no site -->
    
    <head> <!-- Isso é o que será mostrado na aba do site -->
        <meta 
        name="viewport"
        content="width=device-width initial-scale=1.0"
        >
        <title>Portfolio</title>
            
    </head>

    <body> <!-- Isso será o corpo do site. body também pode ser chamado de corpo do html-->

        <header> <!-- Introdução do Site -->
            <h1>Portfólio</h1> <!-- h1 é utilizado para títulos principais -->
            <p>Dev. Walison José</p> <!-- p serve para parágrafo -->
        </header>

        <main> <!-- Desenvolvimento do site ou conteúdo principal -->
            <h2>Tecnologias utilizadas</h2>
            <ol> <!-- ol é utlizado para mostrar mais de uma elemento. Esse que stá sendo utilizado, também serve para ordenar em ordem crescente-->
                <li>Java</li> <!-- Serve para mostrar o elemento e pular e mostrar o próximo na linha abaixo -->
                <li>Python</li>
            </ol>

            <h2>Meus Projetos</h2>
        </main>

        <footer> <!-- Aqui seria a conclusão do site -->
            <p> &copy; Desenvolvido por Walisonjos3</p>

            <ul>

                <li><a href="http:github.com/Walisonjos3"
            target="_blank">github</a></li> <!-- Isso serve para colocar links no site. Ex: Coloquei o do meu GitHub. -->

            <li><a href="https://www.linkedin.com/in/walison-jos%C3%A9-b741863bb/"
            target="_blank">linkedin</a></li> <!-- Isso serve para colocar links no site. Ex: Coloquei o do meu linkedIn. -->

            </ul>

        </footer>

    </body>
</html>
