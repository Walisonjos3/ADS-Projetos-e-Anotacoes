<!DOCTYPE html>
<html lang="pt-BR"> <!-- Isso serve para definir o idioma que será utilizado no site -->

    <head> <!-- Isso é o que será mostrado na aba do site -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Título da Página</title>
    </head>

    <body> <!-- Isso será o corpo do site. body também pode ser chamado de corpo do html -->

        <header> <!-- Introdução do Site -->
            <h1>Título Principal</h1> <!-- h1 é utilizado para títulos principais -->
            <p>Parágrafo</p> <!-- p serve para parágrafo -->
        </header>

        <main> <!-- Desenvolvimento do site ou conteúdo principal -->
            <ol> <!-- ol é utlizado para mostrar mais de uma elemento. Esse que stá sendo utilizado, também serve para ordenar em ordem crescente -->
                <li>Item</li> <!-- Serve para mostrar o elemento e pular e mostrar o próximo na linha abaixo -->
            </ol>

            <a href="#" target="_blank">Link</a> <!-- Isso serve para colocar links no site. Ex: Coloquei o do meu GitHub. -->
        </main>

        <footer> <!-- Aqui seria a conclusão do site -->
        </footer>

    </body>
</html>
